name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow running this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    # the whole CI, browser tests included: nothing is published that did not pass them
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        # Version = commits on main, so it grows with every push (run_number is a fallback-free monotonic counter)
        run: |
          printf "export const APP_VERSION = '1.%s';\nexport const APP_COMMIT = '%s';\n" "${{ github.run_number }}" "${GITHUB_SHA::7}" > src/app/version.ts

      - name: Build the block catalogue
        # library/blocks/*.json -> public/library/catalog.json (fails on a bad id or file name)
        run: node tools/build-catalog.mjs

      - name: Build
        # Production build (baseHref /a-bando-fpv-app/ set in angular.json);
        # artifacts land in dist/a-bando-fpv-app/browser
        run: npm run build

      - name: Disable Jekyll
        # GitHub Pages must serve the Angular bundle as-is, not process it with Jekyll
        run: touch dist/a-bando-fpv-app/browser/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/a-bando-fpv-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
