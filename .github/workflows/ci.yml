name: CI

# Every pull request (a new block in library/blocks, or code): build the catalogue, run the tests, build the app.
on:
  pull_request:
    branches: [main]
  # the deploy workflow runs the same checks (unit, types, translations, examples, build, e2e) before it publishes
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the block catalogue
        run: node tools/build-catalog.mjs

      - name: Example bandos match their script
        # tools/examples/build-examples.ts rebuilds them from the map data and survey in tools/examples/data; a change to
        # the generator, a block or the script that is not rebuilt shows up here
        run: npm run examples && git diff --exit-code -- library/bandos public/library

      - name: Test
        run: npx ng test --watch=false

      - name: Every UI text has its Italian
        run: npm run check:i18n

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit --noUnusedLocals --noUnusedParameters && npx tsc -p tools/examples/tsconfig.json && npx tsc -p tools/i18n/tsconfig.json

      - name: Build
        run: npm run build

  e2e:
    # in a real (headless) browser: every guide step plays on its own, and the main screens pass axe (WCAG 2.1 A / AA)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the block catalogue
        run: node tools/build-catalog.mjs

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Guide steps and accessibility
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
